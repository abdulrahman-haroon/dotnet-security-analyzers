name: False positive
description: A rule warned about code that is actually safe.
labels: ["false positive"]
body:
  - type: markdown
    attributes:
      value: Thanks! False positives are our top priority, because a noisy rule is worse than no rule.
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: DSA001
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Smallest code that triggers the warning
      description: Please remove anything private (real secrets, internal names).
      render: csharp
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this code safe?
      placeholder: e.g. the app sets a fallback policy in another project
    validations:
      required: true
